[package]
name = "aivoice-vox"
version = "0.1.2"
edition = "2024"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
async_zip = { version = "0.0.18", features = ["tokio", "full"] }
axum = { version = "0.8.8", features = ["json"] }
base64 = "0.22.1"
chrono = "0.4.43"
clap = { version = "4.5.54", features = ["derive"] }
derive-getters = "0.5.0"
encoding_rs = "0.8.35"
html-escape = "0.2.13"
indexmap = { version = "2.13.0", features = ["serde"] }
indoc = "2.0.7"
once_cell = "1.21.3"
open = "5.3.3"
process_path = "0.1.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shutdown_hooks = "0.1.0"
strum = { version = "0.27.2", features = ["derive"] }
tasklist = "0.3.1"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
open_jtalk = { git = "https://github.com/VOICEVOX/open_jtalk-rs.git", rev = "a16714c" }
uuid = { version = "1.19.0", features = ["v5", "v4", "serde"] }
ctrlc = "3.5.1"
tempfile = "3.24.0"
image = "0.25.9"
regex = "1.12.2"
derive-new = "0.7.0"
itertools = "0.14.0"
fs-err = "3.2.2"
fxhash = "0.2.1"
wav_io = "0.1.15"
num-derive = "0.4.2"
num-traits = "0.2.19"
num = "0.4.3"

[build-dependencies]
cc = "1.2.54"

[dev-dependencies]
cargo-license = "0.7.0"
